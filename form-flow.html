<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17211f">
  <meta name="description" content="FORM / FLOW — 20 秒原創 motion graphic。字體、幾何變形與 120 BPM 原創聲音設計。">
  <title>FORM / FLOW — Motion in practice</title>
  <style>
    :root{color-scheme:dark;--ink:#17211f;--paper:#f1f0e8;--mint:#b5f6cf;--muted:#a4b5ac}
    *{box-sizing:border-box}body{margin:0;background:#101714;color:var(--paper);font-family:Arial,"Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased}
    main{max-width:1192px;margin:auto;padding:30px 36px 44px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #334138;padding-bottom:22px}.wordmark{font-weight:800;letter-spacing:-.7px;font-size:19px}.edition{font:11px monospace;letter-spacing:2px;color:var(--muted)}
    .intro{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:38px 0 26px}.eyebrow{margin:0 0 11px;color:var(--mint);font:11px monospace;letter-spacing:3px}h1{font-size:clamp(36px,5.5vw,64px);letter-spacing:-3px;line-height:1;margin:0;font-weight:800}.subtitle{font-size:15px;color:var(--muted);margin:16px 0 0;letter-spacing:1px}.specs{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding-bottom:3px}.specs span{font:11px monospace;color:var(--mint);border:1px solid #405248;border-radius:99px;padding:8px 11px;white-space:nowrap}
    .film{position:relative;background:var(--ink);border:1px solid #3a4941;border-radius:8px;overflow:hidden;box-shadow:0 24px 90px #0005}video{display:block;width:100%;aspect-ratio:16/9;background:var(--ink)}
    .actions{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:19px 0 25px;border-bottom:1px solid #334138}.play{background:var(--mint);color:var(--ink);font-size:14px;font-weight:700;border:0;border-radius:4px;cursor:pointer;padding:13px 21px}.play:hover{background:#e8ff79}.play:focus-visible,a:focus-visible,.chapter:focus-visible{outline:3px solid #e8ff79;outline-offset:4px}.download{color:var(--paper);font-size:13px;text-decoration:none;border-bottom:1px solid #657a6a;padding-bottom:4px}.download:hover{color:var(--mint)}.hint{font-size:12px;color:var(--muted);margin-left:14px}#status{font-size:12px;color:var(--mint);margin:0;min-height:16px}
    .chapters{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding:28px 0}.chapter{text-align:left;background:none;border:0;padding:0;color:var(--paper);cursor:pointer}.chapter:hover h2{color:var(--mint)}.chapter time{font:11px monospace;color:var(--mint)}.chapter h2{font-size:18px;margin:12px 0 8px;letter-spacing:-.4px}.chapter p{font-size:13px;color:var(--muted);line-height:1.7;margin:0}.chapter span{font-size:12px;color:var(--mint)}
    footer{display:flex;justify-content:space-between;gap:20px;padding-top:22px;border-top:1px solid #334138;color:#8ba093;font:10px monospace;letter-spacing:1.2px}footer a{color:#a4b5ac;text-decoration:none}footer a:hover{color:var(--mint)}
    @media(max-width:640px){main{padding:22px 18px 30px}.edition{font-size:9px;letter-spacing:1px}.intro{align-items:flex-start;flex-direction:column;padding-top:30px;gap:20px}h1{letter-spacing:-2px}.specs{justify-content:flex-start}.actions{align-items:flex-start}.hint{display:block;margin:10px 0 0}.download{margin-top:12px;white-space:nowrap}.chapters{grid-template-columns:1fr;gap:24px}.chapter{padding-bottom:20px;border-bottom:1px solid #25352c}.chapter:last-child{border-bottom:0;padding-bottom:0}footer{flex-direction:column;gap:10px}}
  </style>
</head>
<body>
<main>
  <header><div class="wordmark">FORM / FLOW</div><div class="edition">AN ORIGINAL MOTION STUDY</div></header>
  <section class="intro" aria-label="作品介紹">
    <div><p class="eyebrow">MADE IN CODE. MADE TO MOVE.</p><h1>FORM / FLOW</h1><p class="subtitle">把想法，變成動態。</p></div>
    <div class="specs"><span>20 SECONDS</span><span>1080P / 30FPS</span><span>120 BPM</span></div>
  </section>
  <div class="film"><video id="video" controls playsinline preload="metadata" poster="assets/poster.png" aria-label="FORM / FLOW 動態設計作品，含原創配樂"><source src="assets/form-flow.mp4" type="video/mp4">你的瀏覽器無法播放此影片，請使用下方下載按鈕。</video></div>
  <div class="actions"><div><button class="play" id="play" type="button">▶ 播放影片（含聲音）</button><span class="hint">可全螢幕觀看，或拖曳進度列。</span></div><a class="download" href="assets/form-flow.mp4" download="FORM-FLOW.mp4">下載 MP4 ↗</a></div>
  <p id="status" role="status" aria-live="polite"></p>
  <section class="chapters" aria-label="跳至技巧示範">
    <button class="chapter" data-time="0" type="button"><time>00:00 — 00:04 ↗</time><h2>Typography in motion</h2><p>文字錯開進場，字母變成幾何；用一致的色彩與節奏建立視覺語言。</p></button>
    <button class="chapter" data-time="4" type="button"><time>00:04 — 00:09.5 ↗</time><h2>One object. New states.</h2><p>同一個 UI 容器連續改變位置、大小、圓角與填色，從工作區變成成品。</p></button>
    <button class="chapter" data-time="9.5" type="button"><time>00:09.5 — 00:20 ↗</time><h2>Picture meets sound</h2><p>120 BPM 原創合成配樂；拍點、游標點擊、轉場與 Logo 音效共用時間軸。</p></button>
  </section>
  <footer><span>ORIGINAL ARTWORK + ORIGINAL SYNTHESIZED SOUND</span><a href="https://www.youtube.com/watch?v=747ZnEtsRbg" target="_blank" rel="noopener noreferrer">WORKFLOW INSPIRED BY LUKAS MARGERIE ↗</a></footer>
</main>
<script>
  const video=document.getElementById('video'),button=document.getElementById('play'),status=document.getElementById('status');
  async function start(){try{await video.play();status.textContent='';}catch(e){if(e.name!=='AbortError')status.textContent='請使用播放器上的播放鍵，或下載 MP4 觀看。';}}
  button.addEventListener('click',()=>{video.paused?start():video.pause()});
  video.addEventListener('play',()=>{button.textContent='Ⅱ 暫停影片'});
  video.addEventListener('pause',()=>{button.textContent=video.ended?'↻ 再看一次':'▶ 繼續播放（含聲音）'});
  video.addEventListener('ended',()=>{button.textContent='↻ 再看一次'});
  video.addEventListener('error',()=>{status.textContent='影片載入失敗，請重新整理或使用下載按鈕。'});
  document.querySelectorAll('[data-time]').forEach(b=>b.addEventListener('click',async()=>{if(video.readyState<1)await new Promise(resolve=>video.addEventListener('loadedmetadata',resolve,{once:true}));video.currentTime=Number(b.dataset.time);await start();}));
</script>
</body>
</html>
